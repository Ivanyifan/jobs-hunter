name: Application Question Blocker

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - codex/application-question-blocker-mvp

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-hunting-agent
    env:
      PYTHONPATH: ${{ github.workspace }}/job-hunting-agent
      MONGO_URI: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Compile Python sources
        run: python -m compileall application_questions mcp_servers frontend

      - name: Run question blocker tests
        run: python -m unittest tests.test_application_question_blocker -v

      - name: Run full test suite
        run: python -m unittest discover -s tests -v
