name: Application Question Blocker

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - codex/application-question-blocker-mvp

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-hunting-agent
    env:
      PYTHONPATH: ${{ github.workspace }}/job-hunting-agent
      MONGO_URI: ""
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Start MongoDB 7 replica set
        run: |
          docker run -d --name mongodb-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if docker exec mongodb-rs mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec mongodb-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            if docker exec mongodb-rs mongosh --quiet --eval "rs.status().ok" | grep -q 1; then
              break
            fi
            sleep 2
          done

      - name: Compile Python sources
        run: python -m compileall application_questions mcp_servers frontend adapters tests

      - name: Replay Workday runtime fixtures
        run: python adapters/workday/replay.py --runtime-dir adapters/workday/fixtures/runtime

      - name: Run Workday runtime contract tests
        run: python -m unittest tests.test_workday_runtime_contracts -v

      - name: Run question blocker tests
        run: python -m unittest tests.test_application_question_blocker -v

      - name: Run full test suite
        run: python -m unittest discover -s tests -v
