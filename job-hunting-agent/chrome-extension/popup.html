<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      width: 320px;
      padding: 15px;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    .header {
      font-size: 16px;
      font-weight: 800;
      color: #6366f1;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    .status-badge.connected {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .value {
      font-size: 14px;
      font-weight: 600;
    }
    button {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>💼 Career Agent Bot</span>
    <span id="status" class="status-badge">Disconnected</span>
  </div>

  <div class="card">
    <div class="title">Active Command Console</div>
    <div id="active-task" class="value">Awaiting instructions from web portal...</div>
  </div>

  <div class="card">
    <div class="title">Last Applied Role</div>
    <div id="last-applied" class="value">None (Idle)</div>
  </div>

  <button id="connect-btn">Connect Backend Console</button>
  <button id="sync-cookies-btn" style="background: #10b981; margin-top: 8px;">Sync LinkedIn Session</button>
  
  <script src="popup.js"></script>
</body>
</html>
