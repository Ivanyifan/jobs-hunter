openapi: 3.0.0
info:
  title: Arize Phoenix Audit Tool
  version: 1.3.0
  description: API for judging tailored resume faithfulness with Phoenix Evals, enforcing deterministic fact gates, and recording Phoenix traces.
servers:
  - url: http://localhost:8003
paths:
  /health:
    get:
      summary: Check Arize audit service health
      operationId: arize_health
      responses:
        '200':
          description: Service health and judge backend status
  /audit:
    post:
      summary: Run faithfulness evaluation and persist an audit trace
      operationId: audit_resume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resume_v0
                - resume_v1
              properties:
                resume_v0:
                  type: string
                  description: Original resume text content
                resume_v1:
                  type: string
                  description: Tailored/modified resume text content
                job_description:
                  type: string
                  description: Optional target job description to match context
                app_id:
                  type: string
                  description: Application memory id used to correlate traces
                company:
                  type: string
                role:
                  type: string
                apply_url:
                  type: string
                model:
                  type: string
                  description: Optional evaluator model override
                trusted_skills:
                  type: array
                  items:
                    type: string
                  description: User-confirmed skills. These may be added only to a dedicated Skills section when V0 has no experience evidence.
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Audit result containing faithfulness scoring, JD match scoring, risk details, and a trace id
          content:
            application/json:
              schema:
                type: object
                properties:
                  trace_id:
                    type: string
                    description: Phoenix-style trace identifier for this audit
                  arize_project:
                    type: string
                  evaluator_name:
                    type: string
                  evaluator_version:
                    type: string
                  model:
                    type: string
                  faithfulness_score:
                    type: number
                    description: Phoenix FaithfulnessEvaluator score between 0.0 and 1.0; deterministic blockers can cap it for diagnostic visibility but passed remains authoritative.
                  jd_match_score:
                    type: number
                    description: Score between 0.0 and 1.0 for how well the tailored resume targets the JD.
                  risk_score:
                    type: number
                    description: One minus faithfulness-like risk score.
                  hallucinated_points:
                    type: array
                    items:
                      type: string
                    description: Specific points or statements identified as fabricated.
                  unsupported_numbers:
                    type: array
                    items:
                      type: string
                  new_entities:
                    type: array
                    items:
                      type: string
                  unsupported_entities:
                    type: array
                    items:
                      type: string
                  unsupported_claims:
                    type: array
                    items:
                      type: string
                  misplaced_trusted_skills:
                    type: array
                    items:
                      type: string
                  untrusted_new_skills:
                    type: array
                    items:
                      type: string
                  hard_blockers:
                    type: array
                    items:
                      type: string
                  passed:
                    type: boolean
                    description: True only when Phoenix Evals judges V1 faithful and every deterministic hard-fact check passes.
                  feedback:
                    type: string
                    description: Diagnostic feedback for the optimizer to review if rejected.
                  recommended_action:
                    type: string
                    enum: [approve, revise_before_apply, retry_audit]
                  evaluator_backend:
                    type: string
                    enum: [phoenix-evals, phoenix-evals-unavailable]
                  phoenix_evaluation:
                    type: object
                    description: Native Phoenix Evals Score including label, score, explanation, kind, direction, and metadata.
                    additionalProperties: true
                  evaluation_error:
                    type: string
                    description: Present when the Phoenix Judge could not produce a Score and the request failed closed.
                  trace:
                    type: object
                    additionalProperties: true
  /traces:
    get:
      summary: List recent audit traces
      operationId: list_arize_traces
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: app_id
          schema:
            type: string
      responses:
        '200':
          description: Recent audit traces
  /summary:
    get:
      summary: Summarize Arize audit traces
      operationId: summarize_arize_traces
      responses:
        '200':
          description: Aggregate audit trace statistics
