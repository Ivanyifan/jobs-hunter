openapi: 3.0.0
info:
  title: MongoDB Application Memory Tool
  version: 1.1.0
  description: Memory API for job applications, status events, form artifacts, and application history.
servers:
  - url: http://localhost:8001
paths:
  /health:
    get:
      summary: Check memory backend health
      operationId: health
      responses:
        '200':
          description: Current backend health

  /applications:
    get:
      summary: List application records
      operationId: list_applications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Application list
    post:
      summary: Save a new application record
      operationId: save_application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRecord'
      responses:
        '200':
          description: Application saved

  /applications/upsert:
    post:
      summary: Create or update an application memory record
      operationId: upsert_application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApplicationRecord'
                - type: object
                  properties:
                    id:
                      type: string
      responses:
        '200':
          description: Application upserted

  /applications/{id}/status:
    patch:
      summary: Update application status and append a status event
      operationId: update_status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                reason:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Status updated

  /applications/{application_id}/question-blockers:
    post:
      summary: Idempotently create an application question blocker
      operationId: create_application_question_blocker
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionBlockerCreate'
      responses:
        '200':
          description: Question blocker created or returned
        '422':
          description: Supplied normalized_text or fingerprint does not match the server canonical value
        '404':
          description: Application not found

  /question-blockers:
    get:
      summary: List application question blockers
      operationId: get_question_blockers
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: batch_id
          in: query
          required: false
          schema:
            type: string
        - name: application_id
          in: query
          required: false
          schema:
            type: string
        - name: fingerprint
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated question blocker list with pagination metadata

  /question-blockers/groups:
    get:
      summary: Group question blockers by deterministic fingerprint
      operationId: get_question_blocker_groups
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Grouped question blockers with occurrence and safe artifact metadata

  /question-blockers/{blocker_id}/approve:
    post:
      summary: Approve a blocker answer for one application or compatible blockers in one batch
      operationId: approve_application_question_blocker
      parameters:
        - name: blocker_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionBlockerApprove'
      responses:
        '200':
          description: Approval result
        '404':
          description: Blocker or application not found
        '409':
          description: Incompatible options or technical review blocker
        '422':
          description: Invalid answer for the blocker control type

  /applications/{id}/events:
    post:
      summary: Append an application event
      operationId: add_event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                event_type:
                  type: string
                payload:
                  type: object
      responses:
        '200':
          description: Event appended

  /applications/{id}/artifacts:
    post:
      summary: Save a structured artifact for an application
      operationId: save_artifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact_type]
              properties:
                artifact_type:
                  type: string
                payload:
                  type: object
                metadata:
                  type: object
      responses:
        '200':
          description: Artifact saved

  /applications/{id}/resume-versions:
    post:
      summary: Save a tailored resume version for an application
      operationId: save_resume_version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                version_label:
                  type: string
                  default: v1
                content:
                  type: string
                source:
                  type: string
                job_description:
                  type: string
                audit_result:
                  type: object
                metadata:
                  type: object
      responses:
        '200':
          description: Resume version saved

  /applications/{id}/memory:
    get:
      summary: Fetch one application's full memory graph
      operationId: get_application_memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application memory graph

  /applications/patterns:
    get:
      summary: Retrieve application success and failure patterns
      operationId: get_patterns
      parameters:
        - name: role_type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Pattern list

  /memory/summary:
    get:
      summary: Summarize application memory
      operationId: memory_summary
      responses:
        '200':
          description: Memory summary

components:
  schemas:
    ApplicationRecord:
      type: object
      required:
        - company
        - role
      properties:
        company:
          type: string
        role:
          type: string
        resume_v0:
          type: string
        resume_v1:
          type: string
        status:
          type: string
          enum: [Pending, Pending Arbitration, Queued, Applying, Applied, Interview, Rejected, Failed, BLOCKED_ON_QUESTIONS, NEEDS_TECHNICAL_REVIEW, READY_TO_RESUME, READY_TO_SUBMIT, SUBMITTING, SUBMITTED, SUBMIT_UNKNOWN]
          default: Pending
        apply_url:
          type: string
        job_description:
          type: string
        source:
          type: string
        metadata:
          type: object
    QuestionBlockerCreate:
      type: object
      required:
        - raw_text
      properties:
        batch_id:
          type: string
        ats:
          type: string
          default: unknown
        tenant:
          type: string
        company:
          type: string
        role:
          type: string
        job_url:
          type: string
        page_name:
          type: string
        stage:
          type: string
          default: unknown
        raw_text:
          type: string
        normalized_text:
          type: string
        fingerprint:
          type: string
        canonical_key:
          type: string
        required:
          type: boolean
          default: true
        control_type:
          type: string
          default: text
        options:
          type: array
          items:
            type: string
        validation_message:
          type: string
        locator_hints:
          type: object
        artifacts:
          type: array
          items:
            type: object
        status:
          type: string
          enum: [UNANSWERED, TECHNICAL_REVIEW]
          default: UNANSWERED
    QuestionBlockerApprove:
      type: object
      required:
        - answer
        - approved_by
      properties:
        answer:
          nullable: true
        scope:
          type: string
          enum: [application, batch]
          default: application
        approved_by:
          type: string
        batch_id:
          type: string
